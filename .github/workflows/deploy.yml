name: Deploy

# Только main: рабочие ветки не должны попадать на боевой сервер.
on:
  push:
    branches: [main]
  # Позволяет запустить деплой вручную из вкладки Actions —
  # удобно, когда надо откатиться или переразвернуть без нового коммита.
  workflow_dispatch:

# Два быстрых пуша подряд не должны деплоиться одновременно:
# они подерутся за docker на сервере. Второй дождётся первого.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Обновить сервер
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Выкатить и проверить
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd /opt/fs-genius

            # reset --hard, а не pull: сервер — не место для правок кода,
            # и деплой должен приводить его ровно к состоянию main.
            # Случайное изменение файла на сервере иначе роняет pull конфликтом.
            # .env не отслеживается, его это не трогает.
            git fetch --prune origin main
            git reset --hard origin/main

            docker compose --profile app up -d --build

            # Старые образы после пересборки остаются без тега.
            # На диске 28 ГБ, образ ~900 МБ — без уборки он кончится за месяц.
            docker image prune -f

            # Проверяем не состояние контейнеров, а то, что нужно на самом деле:
            # отвечает ли приложение по HTTP. Запрос идёт через nginx, то есть
            # разом покрывает и web, и api. Проверять healthcheck одного лишь api
            # мало: при правке только фронта api не перезапускается и здоров сразу,
            # а nginx в этот момент ещё поднимается — и проверка падает на живом
            # приложении.
            echo "Жду, пока приложение ответит…"
            ok=""
            for i in $(seq 1 45); do
              if curl -fsS -m 5 localhost/api/health > /tmp/health.json 2>/dev/null; then
                ok=1
                break
              fi
              sleep 2
            done

            if [ -z "$ok" ]; then
              echo "Приложение не ответило за 90 секунд. Состояние на сервере:"
              docker compose --profile app ps -a
              echo "--- последние логи ---"
              docker compose --profile app logs --tail 50
              exit 1
            fi

            cat /tmp/health.json
            echo ""
            echo "Деплой завершён: $(git rev-parse --short HEAD)"
