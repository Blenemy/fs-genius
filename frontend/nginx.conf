server {
    listen 80;
    server_name topchyidev.shop www.topchyidev.shop;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 2m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Docker embedded DNS. Without a variable in proxy_pass nginx resolves
    # `api` once at start; after `compose up` recreates api, web keeps the
    # old IP and every /api/* is 502 until web is restarted too.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/events {
        set $api_upstream api:3000;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        gzip off;
        # Express-заголовок X-Accel-Buffering этот nginx съедает и наружу не отдаёт.
        # Выставляем свой — чтобы фронтовый nginx на хосте тоже выключил буферизацию.
        add_header X-Accel-Buffering no;
    }

    location /api/ {
        set $api_upstream api:3000;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
