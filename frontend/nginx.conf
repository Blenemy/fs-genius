server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Тело запроса маленькое: файлы пойдут напрямую в S3 мимо сервера (README §6).
    client_max_body_size 2m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Собранная статика именуется с хешем — можно кешировать надолго.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Поток прогресса обработки. Настройки по умолчанию его ломают:
    # nginx копит события в буфере и рвёт соединение через 60 секунд (README §9).
    location /api/events {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        gzip off;
    }

    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Клиентские маршруты должны открываться по прямой ссылке, а не только с главной.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
